#start::after{content:"";position:absolute;inset:0;background:var(--veil)}
#start>*{position:relative;z-index:1}
.logo{width:150px;height:150px;border-radius:50%;background:#fff;display:block;margin:0 auto 12px;box-shadow:0 4px 18px rgba(0,0,0,.2)}
h1{font-size:1.7rem;margin:6px 0 8px;line-height:1.2}
.desc{color:var(--text);margin:0 auto 18px;max-width:440px}
.btn{font:inherit;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-t);border:0;border-radius:14px;padding:14px 28px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#play,#end{width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.9rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 16px;margin-bottom:14px;font-size:1.2rem;font-weight:700;text-align:center;min-height:96px;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid.one{grid-template-columns:1fr}
.opt{font:inherit;font-weight:600;color:#fff;border:0;border-radius:14px;padding:16px 12px;min-height:84px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .1s,opacity .2s}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt .ic{font-size:1.2rem;flex:none}
.opt:nth-child(1){background:#e21b3c}.opt:nth-child(2){background:#1368ce}.opt:nth-child(3){background:#c58a00}.opt:nth-child(4){background:#26890c}
.opt:disabled{cursor:default}
.opt.dim{opacity:.35}
.opt.right{outline:4px solid var(--ok);outline-offset:2px}
.opt.wrong{outline:4px solid var(--bad);outline-offset:2px;opacity:.7}
@media(max-width:480px){.grid{grid-template-columns:1fr}.opt{min-height:64px}}
#fb{margin-top:14px;border-radius:14px;padding:14px;border:2px solid}
#fb.ok{background:var(--okbg);border-color:var(--ok)}
#fb.no{background:var(--badbg);border-color:var(--bad)}
#fb h3{margin:0 0 4px;font-size:1.1rem}
#fb p{margin:0}
#next{margin-top:12px;width:100%}
#end{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 18px;position:relative;z-index:2}
.big{font-size:3.4rem;font-weight:800;color:var(--accent);line-height:1;margin:8px 0}
.stats{display:flex;justify-content:center;gap:10px;margin:12px 0;flex-wrap:wrap}
#cv{position:fixed;inset:0;pointer-events:none;z-index:5;width:100%;height:100%}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<canvas id="cv"></canvas>

function fanfare(){[523,659,784,1047,784,1047,1319].forEach(function(f,k){tone(f,.28,"triangle",.1,k*.14)})}
function prep(){
  Q=shuffle(BANK).map(function(b){
    var idx=b.o.map(function(_,k){return k});
    if(!b.tf)idx=shuffle(idx);
    return{q:b.q,o:idx.map(function(k){return b.o[k]}),a:idx.indexOf(b.a),tf:b.tf,e:b.e};
  });
  i=0;score=0;correct=0;streak=0;best=0;
}
function load(){
  locked=false;var c=Q[i];
  $("num").textContent="Soal "+(i+1)+" / "+Q.length;
  $("pts").textContent="\u2B50 "+score;
  $("streak").textContent="\uD83D\uDD25 "+streak;
  $("prog").style.width=(i/Q.length*100)+"%";
  $("qtext").textContent=c.q;
  $("fb").classList.add("hide");$("next").classList.add("hide");
  var g=$("opts");g.innerHTML="";g.className="grid"+(c.tf?" one":"");
  c.o.forEach(function(t,k){
    var b=document.createElement("button");b.className="opt";
    var s=document.createElement("span");s.className="ic";s.textContent=ICONS[k];
    var x=document.createElement("span");x.textContent=t;
    b.appendChild(s);b.appendChild(x);b.onclick=function(){pick(k)};g.appendChild(b);
  });
}
function pick(k){
  if(locked)return;locked=true;
  var c=Q[i],bs=$("opts").children,ok=(k===c.a);
  for(var j=0;j<bs.length;j++){bs[j].disabled=true;if(j!==c.a&&j!==k)bs[j].classList.add("dim")}
  bs[c.a].classList.add("right");
  var fb=$("fb");
  if(ok){correct++;streak++;if(streak>best)best=streak;var add=100+Math.min(streak-1,4)*20;score+=add;
    fb.className="ok";fb.innerHTML="<h3>\uD83C\uDF89 Benar! +"+add+" poin"+(streak>1?" (streak "+streak+")":"")+"</h3><p>"+c.e+"</p>";
    tone(660,.15,"triangle");tone(880,.2,"triangle",.08,.12);
  }else{streak=0;bs[k].classList.add("wrong");
    fb.className="no";fb.innerHTML="<h3>\u274C Belum tepat</h3><p><b>Jawaban benar: "+c.o[c.a]+"</b></p><p>"+c.e+"</p>";
    tone(220,.3,"sawtooth",.06);
  }
  $("pts").textContent="\u2B50 "+score;$("streak").textContent="\uD83D\uDD25 "+streak;
  fb.classList.remove("hide");
  $("next").textContent=(i===Q.length-1)?"Lihat Skor":"Lanjut";
  $("next").classList.remove("hide");
  $("next").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function finish(){
  show("end");
  $("final").textContent=correct+" / "+Q.length;
  $("pp").textContent="\u2B50 "+score+" poin";
  $("bs").textContent="\uD83D\uDD25 Streak terbaik: "+best;
  if(correct===Q.length){
    $("emoji").textContent="\uD83C\uDFC6\uD83C\uDF89";
    $("msg").textContent="Luar biasa! Semua jawabanmu benar! Kamu benar-benar paham Boyolali. Hore! \uD83D\uDC4F\uD83D\uDC4F\uD83D\uDC4F";
    fanfare();confetti();
  }else if(correct>=7){
    $("emoji").textContent="\uD83D\uDC4D";$("msg").textContent="Hebat, sedikit lagi sempurna! Coba lagi lain kali ya untuk meraih nilai penuh.";
  }else{
    $("emoji").textContent="\uD83D\uDCDA";$("msg").textContent="Belum semuanya benar, coba lagi lain kali ya! Kunjungi Perpustakaan Remen Maos untuk belajar lebih banyak tentang Boyolali.";
  }
}
function confetti(){
  var cv=$("cv"),cx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  var cols=["#e21b3c","#1368ce","#f2b705","#26890c","#ff7ab8","#7a4bff"],P=[];
  for(var n=0;n<180;n++)P.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,w:6+Math.random()*7,h:8+Math.random()*10,vy:2+Math.random()*4,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[n%cols.length]});
  var t0=Date.now();clearInterval(tmr);
  (function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
    if(Date.now()-t0<6500)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height);
  })();
}
function begin(){prep();show("play");load()}
$("startBtn").onclick=begin;
$("again").onclick=function(){$("cv").getContext("2d").clearRect(0,0,9999,9999);begin()};
$("next").onclick=function(){i++;if(i>=Q.length)finish();else{load();window.scrollTo({top:0,behavior:"smooth"})}};
</script>
</body>
</html>
